<html>
<head>
    <title>iisnode logs</title>
    <style type="text/css">
        body
        {
            font-family: "Trebuchet MS" , Arial, Helvetica, sans-serif;
        }
        table
        {
            border-collapse: collapse;
        }
        td, th
        {
            border: 1px solid lightgray;
            padding: 3px 7px 2px 7px;
        }
        th
        {
            text-align: left;
            padding-top: 5px;
            padding-bottom: 4px;
            background-color: Gray;
            color: #ffffff;
        }
        td.stderr
        {
            color: Red;
        }
    </style>
</head>
<body>
    <table id="logFilesTable">
        <tr>
            <th>
                Computer name
            </th>
            <th>
                PID
            </th>
            <th>
                Type
            </th>
            <th>
                Created
            </th>
            <th>
                Link
            </th>
        </tr>
    </table>
    <p id="lastUpdated"></p>
    <script type="text/javascript">

        // this is replaced with actual data at runtime by code in interceptor.js
        var logFiles = [{"file":"CA1SAPP4635P-10392-stderr-1770617540989.txt","computername":"CA1SAPP4635P","pid":10392,"type":"stderr","created":1770617540989},{"file":"CA1SAPP4635P-10392-stdout-1770617540988.txt","computername":"CA1SAPP4635P","pid":10392,"type":"stdout","created":1770617540988},{"file":"CA1SAPP4635P-26384-stderr-1770620679944.txt","computername":"CA1SAPP4635P","pid":26384,"type":"stderr","created":1770620679944},{"file":"CA1SAPP4635P-26384-stdout-1770620679939.txt","computername":"CA1SAPP4635P","pid":26384,"type":"stdout","created":1770620679939},{"file":"CA1SAPP4635P-6404-stderr-1770389645698.txt","computername":"CA1SAPP4635P","pid":6404,"type":"stderr","created":1770389645698},{"file":"CA1SAPP4635P-6404-stdout-1770389645695.txt","computername":"CA1SAPP4635P","pid":6404,"type":"stdout","created":1770389645695},{"file":"CA1SAPP4635P-6404-stdout-1770389801061.txt","computername":"CA1SAPP4635P","pid":6404,"type":"stdout","created":1770389801061},{"file":"CA1SAPP4635P-6404-stdout-1770390887104.txt","computername":"CA1SAPP4635P","pid":6404,"type":"stdout","created":1770390887104},{"file":"CA1SAPP4635P-6404-stdout-1770391427923.txt","computername":"CA1SAPP4635P","pid":6404,"type":"stdout","created":1770391427923},{"file":"CA1SAPP4635P-6404-stdout-1770391958292.txt","computername":"CA1SAPP4635P","pid":6404,"type":"stdout","created":1770391958292},{"file":"CA1SAPP4635P-6404-stdout-1770392071660.txt","computername":"CA1SAPP4635P","pid":6404,"type":"stdout","created":1770392071660},{"file":"CA1SAPP4635P-6404-stdout-1770394574310.txt","computername":"CA1SAPP4635P","pid":6404,"type":"stdout","created":1770394574310}];
        var lastUpdated = 1770620682996;
        var date = new Date();

        date.setTime(lastUpdated);
        document.getElementById('lastUpdated').innerHTML = 'Index was last updated ' + date;

        logFiles.sort(function (a, b) {
            return b.created - a.created;
        });

        var logFilesTable = document.getElementById("logFilesTable");
        for (var i = 0; i < logFiles.length; i++) {
            var logFile = logFiles[i];
            date.setTime(logFile.created);
            var row = logFilesTable.insertRow(-1);
            var computerNameCell = row.insertCell(0);
            var pidCell = row.insertCell(1);
            var typeCell = row.insertCell(2);
            var dateCell = row.insertCell(3);
            var logCell = row.insertCell(4);
            computerNameCell.innerHTML = logFile.computername;
            pidCell.innerHTML = logFile.pid.toString();
            typeCell.innerHTML = logFile.type;
            typeCell.setAttribute('class', logFile.type);
            dateCell.innerHTML = date.toString();
            logCell.innerHTML = '<a href="' + logFile.file + '">log</a>';
        };

    </script>
</body>
</html>
